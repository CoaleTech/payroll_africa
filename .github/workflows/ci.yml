name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests (Frappe v16)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout payroll_africa
        uses: actions/checkout@v4
        with:
          path: apps/payroll_africa

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcups2-dev libmariadb-dev wkhtmltopdf
          sudo npm install -g yarn
          pip install frappe-bench

      - name: Configure MariaDB
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Initialise bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench get-app --branch version-16 erpnext
          bench get-app --branch version-16 hrms
          bench get-app ../apps/payroll_africa

      - name: Configure bench for CI
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --db-host 127.0.0.1 \
            --no-mariadb-socket
          bench --site test_site install-app erpnext hrms payroll_africa
          bench --site test_site set-config allow_tests true

      - name: Run payroll_africa tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app payroll_africa
